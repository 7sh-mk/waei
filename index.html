<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#141526">
  <title>واعي</title>
  <meta name="description" content="اكشف الرسائل والروابط الاحتيالية قبل أن تقع فيها.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 3 5 7v8c0 7 4.7 12.3 11 14 6.3-1.7 11-7 11-14V7z' fill='none' stroke='%231fd3f1' stroke-width='3' stroke-linejoin='round'/%3E%3Cpath d='m11 16 3.5 3.5L21 13' fill='none' stroke='%231fd3f1' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="home">
  <header class="top">
    <a class="brand" href="#" aria-label="home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 5 7v8c0 7 4.7 12.3 11 14 6.3-1.7 11-7 11-14V7z" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="m11 16 3.5 3.5L21 13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="title"></span>
    </a>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ar" lang="ar">ع</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
  </header>

  <main>
    <!-- Home -->
    <section class="view" data-name="home">
      <div class="hero">
        <h1 class="title" data-i18n="title"></h1>
        <p class="tagline" data-i18n="tagline"></p>
        <div class="dial">
          <a class="go" href="#game"><span data-i18n="start"></span></a>
        </div>
      </div>

      <nav class="tools">
        <a class="tool" href="#game">
          <span class="tool-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/><path d="m9 10.5 2 2 4-4"/></svg></span>
          <span class="tool-txt"><b data-i18n="tools.game.name"></b><small data-i18n="tools.game.line"></small></span>
        </a>
        <a class="tool" href="#link">
          <span class="tool-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></span>
          <span class="tool-txt"><b data-i18n="tools.link.name"></b><small data-i18n="tools.link.line"></small></span>
        </a>
      </nav>
    </section>

    <!-- Real or scam? -->
    <section class="view" data-name="game" hidden>
      <a class="back" href="#" data-i18n="back"></a>
      <h1 class="view-title" data-i18n="tools.game.name"></h1>

      <div id="gamePlay">
        <div class="progress">
          <span id="gameProgress" dir="auto"></span>
          <div class="bar"><i id="gameBar"></i></div>
        </div>

        <div class="deck">
          <article class="msg" id="msgCard">
            <span class="stamp stamp-real" data-i18n="game.real"></span>
            <span class="stamp stamp-fake" data-i18n="game.fake"></span>
            <div class="msg-head">
              <span class="avatar" id="msgAvatar" aria-hidden="true"></span>
              <div class="msg-from"><b id="msgSender" dir="auto"></b><small id="msgChannel"></small></div>
            </div>
            <p class="msg-text" id="msgText" dir="auto"></p>
            <p class="msg-link" id="msgLink" dir="ltr" hidden></p>
          </article>
        </div>

        <div id="gameAsk">
          <div class="choices">
            <button type="button" class="btn choice choice-real" id="chooseReal">✓ <span data-i18n="game.real"></span></button>
            <button type="button" class="btn choice choice-fake" id="chooseFake">✗ <span data-i18n="game.fake"></span></button>
          </div>
        </div>

        <div class="feedback" id="feedback" hidden>
          <p class="fb-title" id="fbTitle"></p>
          <p class="fb-kind" id="fbKind"></p>
          <ul class="clues" id="fbClues"></ul>
          <button type="button" class="btn primary" id="nextBtn"></button>
        </div>
      </div>

      <div class="game-result" id="gameResult" hidden>
        <div class="gauge">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <circle class="track" cx="100" cy="100" r="88"/>
            <circle class="arc" id="gameArc" cx="100" cy="100" r="88" pathLength="100"/>
          </svg>
          <div class="gauge-text"><span class="score"><b id="gameScore">0</b><small dir="ltr" id="gameOutOf"></small></span></div>
        </div>
        <p class="verdict" id="gameLevel"></p>
        <p class="sub center" id="gameLine"></p>
        <button type="button" class="btn primary" id="againBtn" data-i18n="game.again"></button>
        <a class="link" href="#" data-i18n="game.home"></a>
      </div>
    </section>

    <!-- Link checker -->
    <section class="view" data-name="link" hidden>
      <a class="back" href="#" data-i18n="back"></a>
      <h1 class="view-title" data-i18n="tools.link.name"></h1>
      <p class="sub center" data-i18n="tools.link.line"></p>

      <form class="link-form" id="linkForm" novalidate>
        <input id="linkInput" type="text" inputmode="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr">
        <button type="submit" class="btn primary" data-i18n="link.check"></button>
      </form>
      <p class="sub center small" data-i18n="link.note"></p>

      <div class="examples">
        <span class="sub" data-i18n="link.examples"></span>
        <div class="chips" id="linkExamples"></div>
      </div>

      <div class="link-result" id="linkResult" hidden>
        <div class="verdict-box" id="linkVerdict">
          <b id="linkVerdictText"></b>
          <span class="domain"><small data-i18n="link.domain"></small> <code id="linkDomain" dir="ltr"></code></span>
        </div>
        <ul class="findings" id="linkFindings"></ul>
        <p class="sub" id="linkHint" hidden></p>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p class="contact-label" data-i18n="contact"></p>
    <div class="social">
      <a class="soc" id="xLink" target="_blank" rel="noopener noreferrer" aria-label="X (Twitter)" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/></svg>
      </a>
      <a class="soc" id="linkedinLink" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.125 2.062 2.062 0 0 1 0 4.125zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
      </a>
      <a class="soc" id="mailLink" aria-label="Gmail" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/></svg>
      </a>
    </div>
    <p class="rights" data-i18n="rights"></p>
  </footer>

  <script src="config.js"></script>
  <script src="scenarios.js"></script>
  <script src="link.js"></script>
  <script src="game.js"></script>
  <script src="app.js"></script>
</body>
</html>
